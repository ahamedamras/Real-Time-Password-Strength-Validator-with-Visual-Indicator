<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength Checker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrapper">
    <div class="card">
        <h2>Password Strength Checker</h2>

        <div class="input-group">
            <input type="password" id="password" maxlength="8" placeholder="Enter your password">
            <span id="toggle">Show</span>
        </div>

        <div class="strength-bar">
            <div id="bar"></div>
        </div>

        <p class="message">Strength: <span id="strength"></span></p>

        <div class="requirements">
            <p id="length">• At least 8 characters</p>
            <p id="upper">• Uppercase letter</p>
            <p id="number">• Number</p>
            <p id="symbol">• Symbol</p>
        </div>

    </div>
</div>

<script src="index.js"></script>
</body>
</html>
